name: Roadmap Demo

on:
  pull_request:
    branches:
      - main

jobs:
  roadmap:
    name: Roadmap
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Milestone 1
        run: python roadmap_milestones/milestone_1_ocr.py

      - name: Milestone 2
        run: python roadmap_milestones/milestone_2_preprocessing.py

      - name: Milestone 3
        run: python roadmap_milestones/milestone_3_ocr_model.py

      - name: Milestone 4
        run: python roadmap_milestones/milestone_4_parser.py

      - name: Milestone 5
        run: python roadmap_milestones/milestone_5_schema.py

      - name: Milestone 6
        run: python roadmap_milestones/milestone_6_validation.py

      - name: Milestone 7
        run: python roadmap_milestones/milestone_7_ai.py